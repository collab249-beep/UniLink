kind = "web"
previewPath = "/admin/"
title = "UniLink Moderation"
description = "A secure moderation dashboard for UniLink administrators to review user reports, inspect abuse patterns, resolve cases, and remove abusive accounts."
version = "1.0.0"
id = "artifacts/unilink-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 24662

[services.development]
run = "pnpm --filter @workspace/unilink-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unilink-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/unilink-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24662"
BASE_PATH = "/admin/"
